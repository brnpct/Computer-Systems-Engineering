<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 400px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; }
        select[multiple] { height: 120px; }
        button { padding: 10px 15px; background: #4f46e5; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #3730a3; }
        a { color: #007BFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Register</h1>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="POST">
        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <label>Topics (choose multiple with Ctrl/Cmd):</label>
        <select name="topics" multiple>
            {% for t in topics %}
                <option value="{{ t.topic }}">{{ t.topic }} ({{ t.posts }} posts)</option>
            {% endfor %}
        </select>

        <button type="submit">Register</button>
    </form>
    <p>Or <a href="{{ url_for('login') }}">Back to Login</a></p>
</body>
</html>
